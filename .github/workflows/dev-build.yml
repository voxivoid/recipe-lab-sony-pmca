name: dev-build

on:
  push:
    branches: [development]
  # create-release calls this after it bumps development. A push made with GITHUB_TOKEN
  # does not start a workflow run, so the trigger above never fires for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not recursive: OpenMemories-Platform pins an stlport submodule whose SourceForge
          # repo is gone, and it is only used by the updater build. APP_STL := stlport_static
          # resolves to the NDK's own bundled STLport.
          ref: development
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # ci.yml does not run on development, so the tests run here. A development build that
      # fails them never becomes a dev prerelease, and create-release refuses to ship it.
      - name: Run the unit tests
        run: ./tools/test.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Label the build with the version semantic-release would publish next, not the one
      # already released -- 1.2.0-dev.3 sorts below 1.2.0, whereas reusing the shipped
      # version would sort below something already out.
      - name: Work out the version being developed towards
        id: next
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "version=$(./tools/next-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Install the SDK packages
        run: |
          # sdkmanager is not on PATH on the runner image.
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          [ -x "$SDKMANAGER" ] || { echo "no sdkmanager under $ANDROID_SDK_ROOT" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;30.0.3" "platforms;android-28" "ndk;16.1.4479499"
      - name: Build
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEV_BASE_VERSION: ${{ steps.next.outputs.version }}
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/16.1.4479499"
          ./build.sh
      - name: Working tree must be clean
        run: git diff --exit-code

      # A rolling prerelease on the `dev` tag: one stable URL that always has the newest
      # development build, without committing a binary to the branch.
      - name: Publish the rolling dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_BASE_VERSION: ${{ steps.next.outputs.version }}
        run: |
          . tools/version.sh
          SHA="$(git rev-parse HEAD)"
          cp RecipeLab.apk "RecipeLab-$VERSION_NAME.apk"
          cp RecipeLab.apk RecipeLab-dev.apk
          sha256sum RecipeLab-dev.apk > RecipeLab-dev.apk.sha256

          # The notes come from the same generator and preset as a real release, so a dev
          # build says what is in it in the same shape people read on the Releases page.
          {
            printf 'Automatic build of `development` @ `%s`.\n\n' "${SHA::7}"
            printf 'Not a release — see [Releases](https://github.com/%s/releases) for stable builds.\n' "$GITHUB_REPOSITORY"
            printf '`RecipeLab-dev.apk` always points at the newest development build.\n\n'
            node tools/dev-notes.js "$VERSION_NAME"
          } > dev-notes.md

          gh release delete dev --yes --cleanup-tag || true
          gh release create dev \
            --prerelease \
            --target "$SHA" \
            --title "v$VERSION_NAME" \
            --notes-file dev-notes.md \
            "RecipeLab-$VERSION_NAME.apk" RecipeLab-dev.apk RecipeLab-dev.apk.sha256
