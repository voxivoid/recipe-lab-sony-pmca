name: sponsors

# The sponsor list in README.md is regenerated from the Sponsors API once a day and lands
# through a pull request, like every other change to main -- only semantic-release commits
# there directly. A run with nothing to change opens no PR.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sponsors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Regenerate the sponsor list
        env:
          # GITHUB_TOKEN cannot read sponsorships at all, whatever its permissions block
          # says: the Sponsors fields need a user token with `read:user`.
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: ./tools/update-sponsors.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # The same PAT again, deliberately. A branch pushed or a PR opened with
          # GITHUB_TOKEN starts no workflow run, so ci.yml would never check this PR.
          token: ${{ secrets.SPONSORS_TOKEN }}
          base: main
          branch: docs/sponsors
          delete-branch: true
          # The title is what semantic-release reads off the squash merge: `docs:` ships
          # nothing, which is right -- the README changed, the app did not.
          title: 'docs: update the sponsor list'
          commit-message: 'docs: update the sponsor list'
          body: |
            Regenerated by `tools/update-sponsors.sh` from the GitHub Sponsors API.

            Public sponsors only — a private sponsorship is not in the API response.
