name: Bug report
description: Something in the app misbehaves on the camera
labels: ["type: fix", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Recipe Lab runs on any Sony body that takes PlayMemories camera apps. It was developed on an **A6000**, and
        the settings IDs come from that body — so on another camera a wrong value or a missing control is expected
        rather than a bug. If that is what you are seeing, the
        [compatibility report](https://github.com/voxivoid/recipe-lab-sony-pmca/issues/new?template=compatibility_report.yml)
        is the better form.
  - type: input
    id: camera
    attributes:
      label: Camera body
      description: Model name and code, if you know it.
      placeholder: "Sony A6000 (ILCE-6000)"
    validations: { required: true }
  - type: input
    id: firmware
    attributes:
      label: Camera firmware version
      description: MENU → Setup → Version
      placeholder: "3.21"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Recipe Lab version
      description: Shown on the release you installed, or `dev` for a development build.
      placeholder: "1.1.0 / dev"
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - PMCA-GUI
        - Sony-PMCA-RE command line (pmca-console.py)
        - Other
    validations: { required: true }
  - type: input
    id: recipe
    attributes:
      label: Which recipe was selected?
      placeholder: "Kodak Portra 400"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include anything shown in the app's panel, verbatim.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch Recipe Lab
        2. Turn the wheel to …
        3. Press …
    validations: { required: true }
  - type: textarea
    id: logfile
    attributes:
      label: Log file
      description: >-
        The app writes what it did, and every error, to `RECIPLAB/LOGS/LOG.TXT` on the memory card. Connect the
        camera over USB (MENU → Setup → USB Connection → Mass Storage) or put the card in a reader, open that file,
        and drag it into this box. Attach the other files in that folder too: `LOG1.TXT` is the older part of the
        log, and `PARAMS.TXT` every camera setting as the app last saw it. No `RECIPLAB` folder on the card means your build is older than the log: say so here.
      placeholder: "2026-10-15 14:03:27  FAIL     Classic Chrome: 01070c7f = 3 refused: Backup_get_datasize failed  (8 of 12 written before it)"
  - type: textarea
    id: diff
    attributes:
      label: Settings that did not change
      description: |
        If a setting did not change to what the recipe shows, the app can find where your camera keeps it. One
        setting at a time:

        1. Open Recipe Lab and store the recipe.
        2. Hold MENU → **Developer** → **Settings snapshot**.
        3. Press MENU to leave the app. In the camera's own menus, set the setting that did not change to the value
           the recipe should have given it (for example Creative Style → B/W, or White Balance → 5500K).
        4. Open Recipe Lab again. Hold MENU → **Developer** → **Settings diff**.
        5. Repeat from step 2 for the next setting. Change nothing else in between, as every change shows up.

        Then attach `RECIPLAB/LOGS/DIFF.TXT` from the card (as for the log above), and list each setting and the
        value you set, in the order you did them.
      placeholder: |
        1. Creative Style → B/W
        2. White Balance → 5500K, A-B 1
  - type: dropdown
    id: powercycle
    attributes:
      label: Did you turn the camera off and on before checking?
      description: Some settings only take effect after a power cycle — this is the single most common cause of "it didn't work".
      options: ["Yes", "No"]
    validations: { required: true }
