name: Bug report
description: Something in the app misbehaves on the camera
labels: ["type: fix", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Two things are all we need: a report file from the camera, and a few words on
        what went wrong.

        **Save the report file** right after the problem happens:

        1. Open Recipe Lab. Hold **MENU** until the app menu opens, choose **Save a bug report**, press the centre
           button.
        2. Connect the camera to your computer with its USB cable, or put the memory card in a card reader.
           (Nothing shows up? On the camera, set MENU → Setup → **USB Connection** to **Mass Storage**.)
        3. Open the **RECIPLAB** folder on the card and drag **REPORT.TXT** into the box below.

        The file already holds your camera, its firmware, the app version, the recipe on screen and what the app
        did, so you do not need to type any of that.
  - type: textarea
    id: logfile
    attributes:
      label: Report file
      description: Drag REPORT.TXT here. No *Save a bug report* in the menu? Your Recipe Lab is older; just tell us your camera below.
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What you did, what you expected, and what happened instead. A photo of the screen helps too.
      placeholder: "I picked Portra 400 and pressed the centre button. With the app closed, my photos still look like Standard."
    validations: { required: true }
