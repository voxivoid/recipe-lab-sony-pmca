name: Bug report
description: Something in the app misbehaves on the camera
labels: ["type: fix", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Recipe Lab runs on any Sony body that takes PlayMemories camera apps. It was developed on an **A6000**, and
        the settings IDs come from that body — so on another camera a wrong value or a missing control is expected
        rather than a bug. If that is what you are seeing, the
        [compatibility report](https://github.com/voxivoid/recipe-lab-sony-pmca/issues/new?template=compatibility_report.yml)
        is the better form.
  - type: input
    id: camera
    attributes:
      label: Camera body
      description: Model name and code, if you know it.
      placeholder: "Sony A6000 (ILCE-6000)"
    validations: { required: true }
  - type: input
    id: firmware
    attributes:
      label: Camera firmware version
      description: MENU → Setup → Version
      placeholder: "3.21"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Recipe Lab version
      description: Shown on the release you installed, or `dev` for a development build.
      placeholder: "1.1.0 / dev"
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - PMCA-GUI
        - Sony-PMCA-RE command line (pmca-console.py)
        - Other
    validations: { required: true }
  - type: input
    id: recipe
    attributes:
      label: Which recipe was selected?
      placeholder: "Kodak Portra 400"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include anything shown in the app's panel, verbatim.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch Recipe Lab
        2. Turn the wheel to …
        3. Press …
    validations: { required: true }
  - type: textarea
    id: logfile
    attributes:
      label: Report file
      description: >-
        On the camera, open Recipe Lab and hold **MENU** → **Save a bug report**. Then connect the camera to a
        computer with the USB cable (or put the memory card in a card reader), open the card, and drag the file
        **RECIPLAB/REPORT.TXT** into this box. No such menu row means your version is older: leave this empty.
  - type: textarea
    id: diff
    attributes:
      label: A setting that did not change (optional)
      description: >-
        Only if a setting did not end up the way the recipe shows. In Recipe Lab, hold MENU → Developer →
        **Settings snapshot**. Leave the app, change that one setting by hand to what the recipe should have set,
        open Recipe Lab again and hold MENU → Developer → **Settings diff**. Then save the bug report again (above)
        and write here which setting you changed, and to what.
      placeholder: "Creative Style → B/W"
  - type: dropdown
    id: powercycle
    attributes:
      label: Did you turn the camera off and on before checking?
      description: Some settings only take effect after a power cycle — this is the single most common cause of "it didn't work".
      options: ["Yes", "No"]
    validations: { required: true }
